name: yummy
description: Yummy is a food platform for customers to order food from a wide variety of restaruants

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  go_router: ^13.0.0
  url_launcher: ^6.2.0

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  drift_flutter: ^0.1.0

  provider: ^6.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.0
  drift_dev: ^2.31.0
  flutter_lints: ^3.0.0
  drift: ^2.31.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/app_icon.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/categories/
    - assets/cinemas/
    - assets/profile_pics/
    - assets/login_background.webp
    - assets/app_icon.jpg